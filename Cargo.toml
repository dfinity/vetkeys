[workspace]
members = [
    "backend/rs/ic_vetkeys",
    "backend/rs/ic_vetkeys_test_utils",
    "backend/rs/canisters/ic_vetkeys_encrypted_maps_canister",
    "backend/rs/canisters/ic_vetkeys_encrypted_maps_custom_canister",
    "backend/rs/canisters/ic_vetkeys_manager_canister",
    "backend/rs/canisters/tests",
    "backend/rs/benchmarks",
]
resolver = "2"

[workspace.package]
authors = ["DFINITY Stiftung"]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Tools and examples for development with vetKeys on the Internet Computer"
repository = "https://github.com/dfinity/vetkeys"
rust-version = "1.89.0"
documentation = "https://docs.rs/ic-vetkeys"

[workspace.dependencies]
canbench-rs = "0.7.0"
candid = "0.10.41"
hex = "0.4.3"
ic-cdk = "0.20.3"
ic-cdk-management-canister = "0.3.0"
ic-stable-structures = "0.7.2"
ic-vetkeys = { path = "backend/rs/ic_vetkeys" }
lazy_static = "1.5.1"
pocket-ic = "16.1.0"
# Default features are disabled because they include `sys_rng`/`thread_rng`, which
# pull in getrandom 0.4 and fail to compile for wasm32-unknown-unknown.
rand = { version = "0.10.4", default-features = false }
rand_chacha = "0.10.0"
serde = "1.0.229"
serde_bytes = "0.11.19"
serde_cbor = "0.11.2"

[profile.release]
lto = true
opt-level = 'z'
panic = 'abort'
