[package]
name = "ic-vetkeys-test-utils"
authors.workspace = true
description.workspace = true
documentation.workspace = true
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["lib"]

[dependencies]
candid = { workspace = true }
ic_bls12_381 = { version = "0.10.1", default-features = false, features = [
    "groups",
    "pairings",
    "alloc",
    "experimental",
    "zeroize",
] }
ic-stable-structures = { workspace = true }
ic-vetkeys = { path = "../ic_vetkeys" }
rand = { workspace = true }
sha2 = "0.10.9"

# `reproducible_rng` seeds from the OS RNG (rand's `thread_rng` feature). Keeping
# it off wasm targets prevents feature unification from pulling getrandom 0.4 into
# workspace-wide wasm32-unknown-unknown builds, where it fails to compile.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rand = { workspace = true, features = ["thread_rng"] }
rand_chacha = { workspace = true }
