name: Publish ic-vetkeys to Mops

env:
  PACKAGE_DIR: backend/mo/ic_vetkeys

on:
  push:
    tags:
      - 'motoko/[0-9]+.[0-9]+.[0-9]+'

run-name: Publish ic-vetkeys ${{ github.ref_name }} to Mops

permissions:
  contents: read

jobs:
  publish-mops:
    runs-on: ubuntu-latest
    # The `mops-publish` environment holds the MOPS_IDENTITY_PEM secret. Because
    # this workflow is tag-triggered, the environment's deployment-tag policy
    # must allow `motoko/*` (a plain branch scope does not match a slashed tag).
    environment:
      name: mops-publish
      url: https://mops.one/ic-vetkeys
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # `mops publish` currently shells out to dfx. This action has no tagged
      # release, so it is pinned to its main HEAD commit.
      - uses: dfinity/setup-dfx@e50c04f104ee4285ec010f10609483cf41e4d365 # main HEAD (no tagged release)

      - uses: ZenVoich/setup-mops@3e94e453352269b34137b5ce49f09a8df81bed7d # v1.4.1
        with:
          # Pin the mops major version to match the other Motoko CI workflows,
          # so publish uses the same toolchain that builds and tests the package.
          mops-version: 2
          identity-pem: ${{ secrets.MOPS_IDENTITY_PEM }}

      # The only pre-publish guard that is both useful and implementable for
      # mops (which has no `mops publish --dry-run`): confirm mops.toml matches
      # the tag being released. Build/compile/tests are already validated by CI
      # on `main` before the tag is pushed.
      - name: Check package version matches tag
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#motoko/}"
          pkg_version=$(grep -E '^version *= *"' mops.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "Version mismatch: mops.toml has $pkg_version but tag is motoko/$tag_version"
            exit 1
          fi

      - name: Install dependencies
        working-directory: ${{ env.PACKAGE_DIR }}
        run: mops install

      - name: Publish to Mops
        working-directory: ${{ env.PACKAGE_DIR }}
        run: mops publish
