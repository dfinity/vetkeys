name: release-npm

on:
  push:
    tags:
      - 'npm/[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run pnpm publish --dry-run"
        required: false
        default: true
        type: boolean

jobs:
  release:
    name: release-npm
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/@icp-sdk/vetkeys
    permissions:
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dfinity/ci-tools/actions/setup-pnpm@7bf36670eaa358cc9fec366965858e4ea84bcc66 # main
        with:
          # Node 24 bundles npm >= 11.5.1, which is required for OIDC trusted
          # publishing. Node 22 ships npm 10.9, which silently skips the OIDC
          # credential exchange and fails the publish with a masked 404. This
          # matches the sibling @icp-sdk repos that publish over OIDC.
          node_version: '24'

      - name: Check package version matches tag
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          pkg_version=$(jq -r '.version' frontend/ic_vetkeys/package.json)
          tag_version="${GITHUB_REF_NAME#npm/}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "Version mismatch: package.json has $pkg_version but tag is npm/$tag_version"
            exit 1
          fi

      - name: Build NPM package
        run: pnpm build

      - name: Audit dependencies
        working-directory: frontend/ic_vetkeys
        # Only audit the production dependency tree — that is what consumers
        # install (the published package ships `dist/` plus the runtime
        # `dependencies`). devDependencies are the build/test/docs toolchain
        # (vite, vite-plugin-dts, typedoc, vitest, eslint, …) and never reach
        # consumers, so their advisories must not gate a release. Dev-tooling
        # vulnerabilities are tracked separately via Dependabot / regular CI.
        run: pnpm audit --prod

      - name: Pack
        working-directory: frontend/ic_vetkeys
        run: npm pack

      - name: Publish to npm
        working-directory: frontend/ic_vetkeys
        # Publish with `npm` (not `pnpm publish`): OIDC trusted publishing is
        # implemented by the npm CLI. `pnpm publish` (v10) only rides it by
        # shelling out to npm, and that delegation is fragile — an unresolved
        # `${NODE_AUTH_TOKEN}` placeholder in .npmrc gets sent as a literal
        # bearer token, which the registry rejects as a masked 404 before OIDC
        # can engage (this is exactly what failed the first 0.5.0 tag). The
        # sibling @icp-sdk/core publishes over OIDC with `npm publish`; mirror it.
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          if [ "${{ github.event.inputs.dry-run }}" = 'true' ]; then
            npm publish --verbose --access public --dry-run
          else
            npm publish --verbose --access public
          fi
